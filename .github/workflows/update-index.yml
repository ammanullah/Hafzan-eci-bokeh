name: Update Chart Automatically

# This will trigger the workflow once every day at midnight UTC.
on:
  schedule:
    - cron: '0 0 * * *'  # Runs once a day at midnight UTC
  # You can also trigger this workflow manually
  workflow_dispatch:

jobs:
  update_chart:
    runs-on: ubuntu-latest

    steps:
      # Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v2

      # Set up Python
      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.8'  # You can change this to the desired Python version

      # Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Run the Python script to generate chart.html
      - name: Generate Chart
        run: |
          python generate_chart.py

      # Commit and push changes (chart.html)
      - name: Commit and push changes
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add chart.html
          git commit -m "Update chart.html"
          git push origin gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Automatically provided by GitHub Actions
