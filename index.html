<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hafzan Composite Index</title>
    <!-- Optional: Include Bootstrap for some basic styling -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        /* Ensures the Bokeh chart is responsive */
        .bk-root {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="text-center mt-5">Hafzan Composite Index</h1>
        <div id="chart-container" class="mt-4">
            <!-- This will be replaced by the Bokeh chart when it's loaded -->
        </div>
    </div>

    <!-- Load BokehJS -->
    <script src="https://cdn.bokeh.org/bokeh/release/bokeh-2.4.3.min.js"></script>

    <!-- Embed the chart generated by Bokeh -->
    <script type="application/javascript">
        // The Bokeh script from your Python-generated chart.html
        var chartScript = document.createElement('script');
        chartScript.src = 'chart.html';
        document.getElementById('chart-container').appendChild(chartScript);
    </script>
</body>
</html>
